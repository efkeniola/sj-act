workflows:

  # ─────────────────────────────────────────────
  # 1. ANDROID RELEASE  (APK + AAB)
  # ─────────────────────────────────────────────
  sj-act-android-release:
    name: SJ ACT — Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - sj_act_secrets
      flutter: default
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Set up keystore
        script: |
          mkdir -p $CM_BUILD_DIR/android/keystore

          # printf avoids echo adding newlines that corrupt base64 decoding
          printf '%s' "$CM_KEYSTORE_BASE64" | base64 --decode \
            > $CM_BUILD_DIR/android/keystore/sj_act_release.jks

          # Verify the keystore decoded correctly
          keytool -list \
            -keystore $CM_BUILD_DIR/android/keystore/sj_act_release.jks \
            -storepass "$CM_KEYSTORE_PASSWORD" | grep "Alias name"

          # Write key.properties — indentation matters, no leading spaces
          cat > $CM_BUILD_DIR/android/key.properties << KEYEOF
storePassword=$CM_KEYSTORE_PASSWORD
keyPassword=$CM_KEY_PASSWORD
keyAlias=$CM_KEY_ALIAS
storeFile=../keystore/sj_act_release.jks
KEYEOF

      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get

      - name: Run tests
        script: |
          cd $CM_BUILD_DIR
          flutter test || true

      - name: Build APK (release)
        script: |
          cd $CM_BUILD_DIR
          flutter build apk --release \
            --dart-define=ACT_API_KEY=$ACT_API_KEY

      - name: Build App Bundle / AAB (release)
        script: |
          cd $CM_BUILD_DIR
          flutter build appbundle --release \
            --dart-define=ACT_API_KEY=$ACT_API_KEY

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - smartjamb8505@gmail.com
        notify:
          success: true
          failure: true

      # ── Uncomment when ready to publish to Play Store ──
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true


  # ─────────────────────────────────────────────
  # 2. ANDROID DEBUG  (quick test builds)
  # ─────────────────────────────────────────────
  sj-act-android-debug:
    name: SJ ACT — Android Debug
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      groups:
        - sj_act_secrets
      flutter: default
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true

    scripts:

      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get

      - name: Build debug APK
        script: |
          cd $CM_BUILD_DIR
          flutter build apk --debug \
            --dart-define=ACT_API_KEY=$ACT_API_KEY

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - smartjamb8505@gmail.com
        notify:
          success: true
          failure: true
