name: sj_act
description: SJ ACT - SmartJAMB ACT Prep App
publish_to: 'none'
version: 1.0.9+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2

  # Network
  http: ^1.2.2

  # Device identity (for activation)
  device_info_plus: ^11.3.0
  crypto: ^3.0.6

  # Deep linking / external URLs (activation store, support email)
  url_launcher: ^6.3.1

  # Charts / analytics
  fl_chart: ^0.70.2

  # IDs
  uuid: ^4.5.1

  # WiFi Challenge — NSD (Network Service Discovery)
  # On pub.dev as "nsd" — works on Android & iOS, wraps NsdManager / NSNetService
  nsd: ^4.0.4

  # Voice reading (TTS) — reads questions aloud, works fully offline
  flutter_tts: ^4.2.0

  # package info for about screen
  package_info_plus: ^8.1.1

  # ── In-app purchase: Google Play Billing (ACT plan checkout) ─────
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+5

  # Pure-Dart gzip/zlib decode for the ACT question bank asset. dart:io's
  # gzip codec only works on the VM (it's backed by native zlib) and
  # throws "Unsupported operation: _newZLibInflateFilter" wherever there's
  # no native binding — notably on web/JS builds, which is exactly what
  # some online build services (e.g. flutlab.io) compile to even for a
  # "mobile" preview. This package decodes gzip in plain Dart, so it works
  # identically on every target.
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # Keeps material_color_utilities consistent across the tree.
  # Update this when the Flutter SDK itself moves to a newer version.
  material_color_utilities: ^0.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
